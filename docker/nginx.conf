server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=10s;

  # NOTE: proxy_pass with a variable upstream (required below for lazy DNS
  # resolution, so nginx still starts if an optional upstream like
  # dashboard-audit isn't deployed) disables nginx's automatic
  # location-prefix stripping. `$uri$is_args$args` is appended explicitly to
  # every proxy_pass so the forwarded path is always intentional, not
  # whatever nginx's implicit (and variable-dependent) prefix magic would do.
  #
  # `/v2/` carries the SSE console-log and in-flight-telemetry streams —
  # proxy_buffering must stay off there (nginx defaults to buffering full
  # upstream responses, which would hold back SSE events instead of
  # streaming them) and proxy_http_version 1.1 with a cleared Connection
  # header is needed for long-lived chunked responses through the proxy.

  location /console/api/ {
    set $daemon http://cartethyia:12800;
    rewrite ^/console/api/(.*)$ /$1 break;
    proxy_pass $daemon$uri$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }
  location /v1/ {
    set $daemon http://cartethyia:12800;
    proxy_pass $daemon$uri$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }
  location /v2/ {
    set $daemon http://cartethyia:12800;
    proxy_pass $daemon$uri$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
  location /internal/ {
    set $audit http://dashboard-audit:8787;
    proxy_pass $audit$uri$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
