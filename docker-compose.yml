# Cartethyia Go daemon + PostgreSQL + Redis.
#
# The existing `dashboard/` is built/deployed separately with the same root
# Dockerfile's `dashboard` target. It calls this daemon's public API on port
# 12800. The Go daemon does not embed or serve dashboard assets.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cartethyia
      POSTGRES_PASSWORD: cartethyia
      POSTGRES_DB: cartethyia
    ports:
      - "5432:5432"
    volumes:
      - cartethyia-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartethyia -d cartethyia"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - cartethyia-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  cartethyia:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: cartethyia
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    pids_limit: 512
    ports:
      - "12800:12800"
    env_file:
      - ${CARTETHYIA_ENV_FILE:-.env}
    environment:
      CARTETHYIA_LISTEN_ADDRESS: ":12800"
      CARTETHYIA_ENV: production
      CARTETHYIA_DATABASE_URL: ${CARTETHYIA_COMPOSE_DATABASE_URL:-postgres://cartethyia:cartethyia@postgres:5432/cartethyia?sslmode=disable}
      CARTETHYIA_REDIS_URL: ${CARTETHYIA_COMPOSE_REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  cartethyia-pg:
  cartethyia-redis:
