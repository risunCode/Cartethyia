services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cartethyia:local
    ports:
      - "${PORT:-12800}:12800"
    # .env supplies the app's own secrets, but Redis location is set below so it
    # overrides that file. Inside the Compose network the app reaches Redis by
    # service name. The interpolation deliberately does not read the host
    # REDIS_URL: environment overrides env_file, so a host-run bun dev value
    # such as redis://localhost:6379 would otherwise enter the container.
    env_file:
      - "${CARTETHYIA_ENV_FILE:-.env}"
    environment:
      NODE_ENV: production
      PORT: "12800"
      DASHBOARD_DIST: /app/dist/dashboard
      CARTETHYIA_DATA_DIR: /app/data
      CARTETHYIA_DB_MODE: ${CARTETHYIA_DB_MODE:-full}
      REDIS_URL: ${CARTETHYIA_REDIS_URL-redis://redis:6379}
    depends_on:
      - redis
    volumes:
      # Lite database, install id, and payload captures live under /app/data;
      # without this mount a container replace wipes them.
      - cartethyia-data:/app/data
    restart: unless-stopped
    networks:
      - cartethyia

  # Redis is bundled for Docker's default full capabilities. Set
  # CARTETHYIA_REDIS_URL empty for the in-memory backend. PostgreSQL is never
  # bundled; full mode reaches it through DATABASE_URL in .env.
  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cartethyia

volumes:
  redisdata:
  cartethyia-data:

networks:
  cartethyia:
    driver: bridge
