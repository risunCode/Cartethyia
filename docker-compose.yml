services:
  cartethyia:
    build:
      context: .
      dockerfile: Dockerfile
    image: cartethyia
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    pids_limit: 512
    ports:
      - "12800:8080"
    environment:
      - PORT=8080
      - DATA_DIR=/app/data
      # Required: Compose fails closed when production credentials are absent.
      - CONSOLE_PASSWORD=${CONSOLE_PASSWORD:?CONSOLE_PASSWORD must be set}
      - CONSOLE_JWT_SECRET=${CONSOLE_JWT_SECRET:?CONSOLE_JWT_SECRET must be set}
      - CARTETHYIA_HEADROOM_ENABLED=${CARTETHYIA_HEADROOM_ENABLED:-false}
      - CARTETHYIA_HEADROOM_URL=${CARTETHYIA_HEADROOM_URL:-}
      - CARTETHYIA_HEADROOM_TIMEOUT_MS=${CARTETHYIA_HEADROOM_TIMEOUT_MS:-3000}
      - CARTETHYIA_HEADROOM_COMPRESS_USER_MESSAGES=${CARTETHYIA_HEADROOM_COMPRESS_USER_MESSAGES:-false}
    volumes:
      - cartethyia-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  cartethyia-data:
