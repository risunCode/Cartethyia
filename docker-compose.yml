services:
  cartethyia:
    build:
      context: .
      dockerfile: Dockerfile
    image: cartethyia
    restart: unless-stopped
    ports:
      - "12800:8080"
    # Warp SOCKS5 ports are internal-only (127.0.0.1) — exposed to the
    # container network so Railway/platforms are aware of the range, but
    # NOT mapped to the host. The proxy pool connects to 127.0.0.1 internally.
    expose:
      - "40001"
      - "40002"
      - "40003"
      - "40004"
      - "40005"
      - "40006"
      - "40007"
      - "40008"
      - "40009"
      - "40010"
      - "40011"
      - "40012"
      - "40013"
      - "40014"
      - "40015"
      - "40016"
      - "40017"
      - "40018"
      - "40019"
      - "40020"
    environment:
      - PORT=8080
      - DATA_DIR=/app/data
      # Required: change these before any non-local use.
      - CONSOLE_PASSWORD=${CONSOLE_PASSWORD:-change-me}
      - CONSOLE_JWT_SECRET=${CONSOLE_JWT_SECRET:-replace-with-a-long-random-secret}
    volumes:
      - cartethyia-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  cartethyia-data:
