services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cartethyia:local
    ports:
      - "${PORT:-12800}:12800"
    # .env supplies the app's own secrets and knobs, but the database and Redis
    # locations are set below where they override it: inside the Compose network
    # the app reaches both by service name, not through a host-oriented .env
    # that points DATABASE_URL at localhost. Set CARTETHYIA_DB_MODE=lite for the
    # embedded database, or set CARTETHYIA_REDIS_URL empty for the in-memory
    # backend. The interpolation deliberately does NOT read the host REDIS_URL:
    # env_file is applied first and environment overrides it, so the `.env`
    # written for a host-run `bun dev` (redis://localhost:6379, not the bundled
    # container) would ride into the app, and every Redis command would fail.
    env_file:
      - "${CARTETHYIA_ENV_FILE:-.env}"
    environment:
      NODE_ENV: production
      PORT: "12800"
      DASHBOARD_DIST: /app/dist/dashboard
      CARTETHYIA_DATA_DIR: /app/data
      CARTETHYIA_DB_MODE: ${CARTETHYIA_DB_MODE:-full}
      REDIS_URL: ${CARTETHYIA_REDIS_URL-redis://redis:6379}
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD:-postgres}\
        @postgres:5432/${POSTGRES_DB:-cartethyia}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Lite database, install id, and payload captures live under /app/data;
      # without this mount a container replace wipes them.
      - cartethyia-data:/app/data
    restart: unless-stopped
    networks:
      - cartethyia

  # Redis is bundled for Docker's default full capabilities. Set
  # CARTETHYIA_REDIS_URL= (on the host shell or in a Compose env file) to use
  # the in-memory backend instead. A local
  # PostgreSQL is bundled too, so full mode works out of the box: the app
  # migrates it at boot, and a fresh postgres volume comes up ready. Point a
  # deployment at an external database by overriding DATABASE_URL or dropping
  # the `postgres` service entirely.
  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cartethyia

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Reached by the app over the Compose network as `postgres`, so no host port
    # is published: a loopback 5432 mapping would collide with a locally
    # installed PostgreSQL, which is the common host-run dev setup. Set
    # POSTGRES_PASSWORD and POSTGRES_DB in .env to change the credentials; the
    # app reads the same values through the interpolated DATABASE_URL above.
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cartethyia}
    volumes:
      - postgresdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-cartethyia}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cartethyia

volumes:
  redisdata:
  postgresdata:
  cartethyia-data:

networks:
  cartethyia:
    driver: bridge
