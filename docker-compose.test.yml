services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cartethyia_test
      POSTGRES_PASSWORD: cartethyia_test
      POSTGRES_DB: cartethyia_test
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - cartethyia_test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartethyia_test -d cartethyia_test"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  cartethyia_test_pgdata:
