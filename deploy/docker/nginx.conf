server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=10s;

  # NOTE: proxy_pass with a variable upstream (required below for lazy DNS
  # resolution) disables nginx's automatic
  # location-prefix stripping. `$uri$is_args$args` is appended explicitly to
  # every proxy_pass so the forwarded path is always intentional, not
  # whatever nginx's implicit (and variable-dependent) prefix magic would do.
  #
  # `/console/` carries the SSE console-log and in-flight-telemetry streams —
  # proxy_buffering must stay off there (nginx defaults to buffering full
  # upstream responses, which would hold back SSE events instead of
  # streaming them) and proxy_http_version 1.1 with a cleared Connection
  # header is needed for long-lived chunked responses through the proxy.

  location /console/ {
    set $daemon http://cartethyia:12800;
    proxy_pass $daemon$uri$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
  location /v1/ {
    set $daemon http://cartethyia:12800;
    proxy_pass $daemon$uri$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }
  location /v1beta/ {
    set $daemon http://cartethyia:12800;
    proxy_pass $daemon$uri$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }
  # Daemon share API only: monitor data snapshots, the live count stream,
  # and the one-shot setup flow. Every other /share/ path is the SPA's
  # share page and falls through to the try_files below (regex locations
  # take precedence over the prefix `location /`).
  location ~ ^/share/(setup/.+|.+/(data|stream))$ {
    set $daemon http://cartethyia:12800;
    proxy_pass $daemon$uri$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
